[program:wan-comfyui]
command=/opt/wan22-serverless/start_comfyui.sh
priority=10
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
environment=PROC_NAME="wan-comfyui"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:wan-model-server]
command=/opt/wan22-serverless/start_model_server.sh
priority=20
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
environment=PROC_NAME="wan-model-server"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:wan-pyworker]
command=/opt/wan22-serverless/start_worker.sh
priority=30
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
environment=PROC_NAME="wan-pyworker"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
